<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fleet operations</title>
<style>
  :root { --bg:#EEF2EF; --ink:#18241D; --muted:#5A6B61; --line:#CFD9D2; --ok:#1E7B4F; --warn:#B7791F; --err:#B83227; }
  @media (prefers-color-scheme: dark) { :root { --bg:#121A15; --ink:#E2EBE5; --muted:#97A89D; --line:#2A3A30; --ok:#4CC38A; --warn:#E3A64A; --err:#F06B5D; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width:960px; margin:0 auto; padding:28px 20px 60px; }
  h1 { margin:0; font-size:32px; }
  #summary { color:var(--muted); margin:4px 0 22px; }
  .table-wrap { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:10px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { color:var(--muted); font-weight:400; font-size:14px; }
  .bar { width:120px; height:10px; background:var(--line); border-radius:5px; overflow:hidden; display:inline-block; vertical-align:middle; margin-right:8px; }
  .bar span { display:block; height:100%; background:var(--ok); }
  .low span { background:var(--err); } .mid span { background:var(--warn); }
  .offline { color:var(--err); font-weight:700; }
  button { font:inherit; font-size:14px; font-weight:700; padding:5px 10px; margin-right:4px; border:2px solid var(--ink); border-radius:5px; background:transparent; color:var(--ink); cursor:pointer; }
  button:hover { background:var(--ink); color:var(--bg); }
  button:focus-visible { outline:3px solid var(--ok); outline-offset:2px; }
  #msg { min-height:24px; font-weight:700; margin-top:14px; }
  pre { font-size:13px; overflow-x:auto; padding:12px; border:1px solid var(--line); border-radius:6px; }
</style>
</head>
<body>
<main>
  <h1 id="title">Fleet operations</h1>
  <p id="summary">Connecting…</p>
  <div class="table-wrap">
    <table>
      <thead><tr><th>Robot</th><th>Battery</th><th>Status</th><th>Position</th><th>Last seen</th><th>Send command</th></tr></thead>
      <tbody id="robots"><tr><td colspan="6">Waiting for the first telemetry message…</td></tr></tbody>
    </table>
  </div>
  <p id="msg" role="status" aria-live="polite"></p>
  <details><summary>Fleet details</summary><pre id="fleet"></pre></details>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function refresh() {
  try {
    const [fleet, robots] = await Promise.all([fetch('/api/fleet').then(r => r.json()), fetch('/api/robots').then(r => r.json())]);
    $('title').textContent = fleet.fleet;
    const online = Array.isArray(robots) ? robots.filter(r => r.online).length : 0;
    $('summary').textContent = `${online} of ${robots.length || 0} robots online. MQTT ${fleet.mqtt}. ${fleet.database.telemetry_rows ?? '?'} telemetry rows (${fleet.database.telemetry_size ?? '?'}).`;
    $('fleet').textContent = JSON.stringify(fleet, null, 2);
    if (!Array.isArray(robots) || !robots.length) return;
    $('robots').innerHTML = robots.map(r => {
      const b = Math.round(r.battery);
      const cls = b < 20 ? 'low' : b < 50 ? 'mid' : '';
      return `<tr>
        <td><strong>${esc(r.id)}</strong></td>
        <td><span class="bar ${cls}"><span style="width:${b}%"></span></span>${b}%</td>
        <td>${r.online ? esc(r.status) : '<span class="offline">offline</span>'}</td>
        <td>${Number(r.x).toFixed(1)}, ${Number(r.y).toFixed(1)}</td>
        <td>${r.age_sec}s ago</td>
        <td>${['dock','resume','stop'].map(c => `<button data-robot="${esc(r.id)}" data-cmd="${c}">${c[0].toUpperCase() + c.slice(1)}</button>`).join('')}</td>
      </tr>`;
    }).join('');
  } catch (e) {
    $('summary').textContent = `Can't reach the fleet API: ${e.message}`;
  }
}

$('robots').addEventListener('click', async (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  const r = await fetch(`/api/robots/${b.dataset.robot}/command`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ command: b.dataset.cmd }),
  });
  const d = await r.json();
  $('msg').textContent = r.ok ? `Sent "${d.sent}" to ${d.robot}.` : d.error;
  setTimeout(refresh, 600);
});

refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
