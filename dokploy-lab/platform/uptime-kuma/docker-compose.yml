# Uptime monitoring. You can also create it from Dokploy's templates instead of this file.
# Domain in Dokploy: service "uptime-kuma", port 3001.
services:
  uptime-kuma:
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    expose:
      - "3001"
    volumes:
      - kuma-data:/app/data

volumes:
  kuma-data:
