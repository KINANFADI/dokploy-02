services:
  minio:
    image: bitnamilegacy/minio:latest
    restart: unless-stopped
    user: root
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-labadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ChangeMe-minio-123}
      MINIO_DEFAULT_BUCKETS: db-backups,volume-backups
      MINIO_CONSOLE_PORT_NUMBER: "9001"
    expose:
      - "9000"
      - "9001"
    volumes:
      - minio-data:/bitnami/minio/data

volumes:
  minio-data:
