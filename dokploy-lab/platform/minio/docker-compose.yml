# Local S3 storage for the lab, so you can test Dokploy backups without a cloud account.
# Domains in Dokploy: service "minio", port 9000 (S3 API) and port 9001 (web console).
# If this image is unavailable in your region or version, use Cloudflare R2 instead (see LAB.md).
services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-labadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ChangeMe-minio-123}
    expose:
      - "9000"
      - "9001"
    volumes:
      - minio-data:/data

volumes:
  minio-data:
